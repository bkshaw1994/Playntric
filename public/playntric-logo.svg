<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="logo-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="logo-grad-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow-light" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark (Gamepad Emblem) -->
  <g transform="translate(10, 10)">
    <!-- Outer Shield / Hexagon -->
    <polygon points="30,2 58,16 58,44 30,58 2,44 2,16" fill="url(#logo-grad-primary)" filter="url(#glow-light)" opacity="0.9" />
    <polygon points="30,6 54,18 54,42 30,54 6,42 6,18" fill="#0f172a" />

    <!-- Gamepad D-Pad & Buttons -->
    <!-- D-Pad Left -->
    <path d="M 18,30 L 25,24 L 25,36 Z" fill="url(#logo-grad-accent)" />
    <!-- Buttons Right -->
    <circle cx="40" cy="25" r="3" fill="#06b6d4" />
    <circle cx="45" cy="30" r="3" fill="#a855f7" />
    <circle cx="35" cy="30" r="3" fill="#10b981" />
    <circle cx="40" cy="35" r="3" fill="#f59e0b" />

    <!-- Center Gem -->
    <polygon points="30,22 36,30 30,38 24,30" fill="url(#logo-grad-primary)" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(80, 52)">
    <text font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="1.5" fill="url(#text-grad)">
      PLAYNTRIC
    </text>
    <!-- Subtitle Tagline -->
    <text font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10" letter-spacing="4" fill="#06b6d4" y="16" x="2">
      PRO GAMING PORTAL
    </text>
  </g>
</svg>
